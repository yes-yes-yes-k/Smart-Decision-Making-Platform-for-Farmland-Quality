[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_culti_demo"
version = "0.1.0"
description = "Unified framework for RAG, Function Calling, and Multi-Agent architecture"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-JWT-Extended>=4.6.0",
    "Flask-CORS>=4.0.0",
    "geoalchemy2>=0.14.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "langchain-core>=1.4.7,<2",
    "langchain-openai>=1.1,<2",
    "langchain-community>=0.4,<1",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "chromadb>=0.5.0",
    # Chroma 0.x still calls the pre-6 positional capture API.
    "posthog>=2.4,<6",
    "jieba>=0.42.0",
    "rank_bm25>=0.2.2",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "networkx>=3,<4",
    "numpy>=2,<3",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "pycryptodome>=3.20.0",
    "pdfplumber>=0.11.0",
    "pdf2image>=1.17.0",
    "imagesize==1.3.0",
    "PyMuPDF==1.26.5",
    "pytesseract>=0.3.13",
    "openpyxl>=3.1.0",
    "waitress>=3.0.0",
    # Pickled RF assets record this exact version; sklearn warns on patch drift.
    "scikit-learn==1.9.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    "geopandas>=1.0.0",
    "shapely>=2.1.0",
    "rasterio>=1.4,<2",
    "seaborn>=0.13,<1",
    "matplotlib>=3.8,<4",
    "requests>=2.32.0",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = ".", ai_culti_demo = "src/ai_culti_demo"}

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["framework*", "ai_culti_demo*"]
namespaces = false
